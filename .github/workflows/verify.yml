name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Repository contract
        run: node scripts/verify/repository.mjs
      - name: Context adapter and model manifest tests
        run: node --test shared/chat/test-context-manager.mjs shared/chat/test-local-responses-adapter.mjs scripts/models/test-models.mjs
      - name: Rust format
        run: cargo fmt --all -- --check
      - name: Rust type and platform checks
        run: cargo check --workspace
      - name: Rust tests
        run: cargo test --workspace --no-fail-fast
      - name: Release build
        run: cargo build --workspace --release
